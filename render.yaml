services:
  - type: web
    name: pharmacy-site
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_URL
        sync: true
      - key: SUPABASE_ANON_KEY
        sync: true
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: true
      - key: ADMIN_PASSWORD_HASH
        sync: true
      - key: TOKEN_SECRET
        sync: true
      - key: TOKEN_TTL_HOURS
        value: "24"
      - key: COOKIE_SECURE
        value: "true"