name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check Python files (backend)
        run: |
          python -m compileall -q backend scripts && echo "Python OK"

      - name: Import check (app must boot)
        run: |
          python - <<'EOF'
          from backend.app.main import app
          paths = set(app.openapi()["paths"])
          assert "/api/products" in paths and "/api/orders" in paths and "/api/auth/login" in paths
          print("import OK", len(paths), "api paths")
          EOF

      - name: Check JS syntax (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check frontend/assets/app.js && node --check frontend/assets/cart.js && node --check frontend/assets/whatsapp.js && node --check frontend/assets/api.js && node --check frontend/assets/admin.js && echo "JS OK"

      - name: Boot server + smoke test
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          sleep 4
          curl -sf http://127.0.0.1:8000/api/health || exit 1
          curl -sf http://127.0.0.1:8000/ | grep -qi "SALLAQ" || exit 1
          curl -sf http://127.0.0.1:8000/admin | grep -q "لوحة إدارة" || exit 1
          # تأكد ألا شيء مكشوف
          for p in .env api.py products.json requirements.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000/$p")
            [ "$code" = "404" ] || { echo "EXPOSED: $p -> $code"; exit 1; }
          done
          echo "Smoke OK"